<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>错误是线索 · Seed Grove</title>
<style>
  :root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#54473d;background:#f7f1e7;line-height:1.7}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:28px 24px 42px}.kicker{font-size:12px;letter-spacing:.15em;color:#92705f}h1{font:500 clamp(29px,5vw,43px) Georgia,"Songti SC",serif;margin:8px 0}header{max-width:670px}#story{margin:12px 0 22px}.lab{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}.experiment{background:#e8ddc8;border:1px solid #c4b290;border-radius:24px 14px 21px 15px;overflow:hidden}.experiment svg{display:block;width:100%;height:285px;background:#f2ebda}.bench{height:18px;background:#ad8c6e;border-top:3px solid #8f7057}.model-note{padding:12px 17px;margin:0;font-size:12px;color:#8a745e}.controls{background:#fffaf0;padding:20px;border:1px solid #d2c4aa;border-radius:14px 21px 12px 18px}h2{font-size:20px;margin:0 0 17px}.control{margin:0 0 18px}.control label{display:flex;justify-content:space-between;gap:12px;font-size:15px;margin-bottom:9px}.control output{color:#956c4e}input[type=range]{width:100%;accent-color:#987650;min-height:28px}input:focus-visible,button:focus-visible{outline:3px solid #8a6942;outline-offset:4px}button{font:inherit;color:inherit;min-height:47px;padding:10px 17px;border:1px solid #bcab8b;background:#fffaf0;border-radius:11px 15px 12px 9px;cursor:pointer}button:hover{background:#ebdfc6}.primary{background:#8a6c54;color:#fff;width:100%}.primary:hover{background:#745a46}#result{padding:20px 22px;background:#fffaf0;border-left:3px solid #b79473;border-radius:0 16px 16px 0;min-height:96px;margin:24px 0 18px}.loop{display:flex;gap:12px;flex-wrap:wrap;color:#8f7963;font-size:13px;margin:18px 0}.loop span{padding:7px 12px;border:1px dashed #cbb798;border-radius:20px}.log{background:#eee5d5;padding:18px 20px;border-radius:14px}.log h3{font-size:14px;margin:0 0 8px}.log ol{padding-left:24px;margin:0;font-size:13px}.log li{padding:5px 0}.reflection{padding:20px 0}.reflection small{color:#8a7865}.reflection p{margin-top:0}#reset{margin-top:12px}.block{stroke:#876a51;stroke-width:1.5}[hidden]{display:none!important}@media(max-width:600px){main{padding:20px 15px}.lab{grid-template-columns:1fr;gap:15px}.experiment svg{height:235px}.controls{padding:18px}.control{margin-bottom:14px}.loop{gap:6px;font-size:12px}.loop span{padding:6px 9px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
details{margin:24px auto;padding:15px 18px;border:1px dashed currentColor;border-radius:14px;max-width:700px}summary{cursor:pointer;min-height:44px;padding:9px 0;font-weight:600}summary:focus-visible{outline:3px solid #96713f;outline-offset:4px}details p{margin:12px 0}details button{margin:4px 4px 4px 0}#deeper-result{min-height:28px}details[open] summary{margin-bottom:10px}</style></head><body><main>
<header><p class="kicker">反馈实验室 / 一张会留下线索的工作台</p><h1>错误是线索</h1><p id="story"></p></header>
<div class="lab"><section class="experiment" aria-label="积木实验台"><svg id="tower" viewBox="0 0 400 290" role="img" aria-label="积木塔，还没有试放"><path d="M35 264H365" stroke="#bda482" stroke-width="2"/><path d="M40 32h72m-64 14h52" stroke="#ded1b7" stroke-width="4"/><g id="blocks"></g><path id="wind-lines" d="M18 114h65m-75 15h49m-30 15h62" fill="none" stroke="#91aeb0" stroke-width="3" stroke-linecap="round" opacity="0"/></svg><div class="bench"></div><p class="model-note">一个简化的积木模型，用来练习观察与调整。真实搭建还会受材料、摆放等影响。</p></section>
<section class="controls"><h2 id="question">先试一次，会看到什么？</h2><div class="control"><label for="width">底座宽度 <output id="width-value" for="width"></output></label><input id="width" type="range" min="1" max="3" value="1" step="1"></div><details><summary>再想一步</summary><p>还是这座塔。如果加一层积木，或吹来一点风，会怎样？先只改一个条件，再和上次比。</p><div id="height-control" class="control"><label for="height">积木层数 <output id="height-value" for="height"></output></label><input id="height" type="range" min="2" max="6" value="4" step="1"></div><div id="wind-control" class="control"><label for="wind">侧面的小风 <output id="wind-value" for="wind"></output></label><input id="wind" type="range" min="0" max="2" value="0" step="1"></div><p>收起这里会保留你调过的条件。实验记录会写下层数和风，方便回头比较。</p></details><button id="test" class="primary">试放积木</button></section></div>
<p id="result" role="status" aria-live="polite">先留下一个结果，再决定下一次只改哪里。</p>
<div class="loop" aria-label="反馈小循环"><span>试一试</span><span>看结果</span><span>找线索</span><span>改一点</span><span>再试</span></div>
<section id="log-panel" class="log" hidden><h3>这几次看到的结果</h3><ol id="log"></ol><button id="reset">清空实验，重新观察</button></section>
<aside id="reflection" class="reflection" hidden><p id="real-life"></p><small>可以在花园页面的反思框里写下你观察到的线索，再亲手保存。</small></aside>
</main><script>
(() => {
  const $ = id => document.getElementById(id); const history = [];
  $('story').textContent = '小熊的积木塔晃了一下。先试放一次，再只把底座变宽一点。两次看到的结果，会有什么不同？';
  $('real-life').textContent = '今天有件事不顺利时，你想先看见什么结果，再只改哪一点？这个小模型之外，还有什么值得亲手试试？';
  function values() { return {width:Number($('width').value),height:Number($('height').value),wind:Number($('wind').value)}; }
  function draw(collapsed = false) {
    const {width,height,wind} = values();
    $('width-value').textContent = ['窄窄的','宽一点','再宽一点'][width-1]; $('height-value').textContent = height+' 层'; $('wind-value').textContent = ['没有风','一点风','更大一点'][wind];
    $('blocks').replaceChildren();
    for (let i = 0; i < height; i++) {
      const block = document.createElementNS('http://www.w3.org/2000/svg','rect');
      const w = i === 0 ? 45+width*30 : 58;
      block.setAttribute('x',String(200-w/2+(collapsed && i > 0 ? i*12 : 0))); block.setAttribute('y',String(254-(i+1)*31+(collapsed && i > 0 ? i*12 : 0))); block.setAttribute('width',String(w)); block.setAttribute('height','29'); block.setAttribute('rx','5'); block.setAttribute('fill',['#cbaa79','#9eb0a0','#c9a493','#a9b8ba','#d8c493','#baa9be'][i]); block.classList.add('block');
      if (collapsed && i > 0) block.setAttribute('transform','rotate('+(i*9)+' '+(200+i*12)+' '+(254-i*19)+')');
      $('blocks').append(block);
    }
    $('wind-lines').setAttribute('opacity',String(wind ? .3+wind*.3 : 0));
    $('tower').setAttribute('aria-label',collapsed ? '积木向一侧倾倒，底座仍在桌上' : '积木垂直摆在底座上，底座宽度 '+width+'，共 '+height+' 层');
  }
  for (const id of ['width','height','wind']) $(id).addEventListener('input', () => { draw(); $('result').textContent = '条件已经调整。再点“试放积木”，看看结果与上一次有什么不同。'; $('question').textContent = '这一次调整，会带来什么结果？'; });
  $('test').addEventListener('click', () => {
    const current = values(); const previous = history.at(-1); const changed = previous ? ['width','height','wind'].filter(key => previous[key] !== current[key]) : [];
    const stable = current.width*2 >= current.height+current.wind;
    const observation = stable ? '这一次，塔保持站立。' : '这一次，塔向一侧倾倒。';
    draw(!stable);
    let clue = stable ? '可以先记下底座和层数，再试一个小变化。' : '先观察底座与上面的层数。下一次可以试着加宽底座，看看下一次有什么不同。';
    if (previous && changed.length === 0) clue = '这次条件与上次相同。在这个固定规则的小模型里，结果也相同。';
    else if (previous && changed.length === 1) clue = '与上次相比，只改了'+({width:'底座宽度',height:'积木层数',wind:'风的大小'}[changed[0]])+'。'+(stable === previous.stable ? '结果仍然相同，这也是一条线索。' : '结果发生了变化，可以继续检查这条线索。');
    else if (previous && changed.length > 1) clue = '这次同时改了 '+changed.length+' 个条件，还不能分清哪个变化带来了结果。可以回到上次条件，再只改一点。';
    $('result').textContent = observation+clue;
    history.push({...current,stable}); if (history.length > 4) history.shift();
    $('log').replaceChildren(); history.forEach(item => { const li = document.createElement('li'); li.textContent = '底座 '+['窄','中','宽'][item.width-1]+' · '+item.height+' 层'+' · 风 '+item.wind+' → '+(item.stable ? '保持站立' : '向一侧倾倒'); $('log').append(li); });
    $('log-panel').hidden = false; $('reflection').hidden = false; $('question').textContent = '下一次，你想只改哪一点？';
  });
  $('reset').addEventListener('click', () => { history.length = 0; $('width').value = '1'; $('height').value = '4'; $('wind').value = '0'; draw(); $('log').replaceChildren(); $('log-panel').hidden = true; $('reflection').hidden = true; $('question').textContent = '先试一次，会看到什么？'; $('result').textContent = '实验回到起点。先留下一个结果，再决定下一次只改哪里。'; $('test').focus(); });
  draw();
})();
</script></body></html>
