<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每一个选择都有交换 · Seed Grove</title>
<style>
  :root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#544638;background:#faf3e5;line-height:1.7}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:28px 24px 40px}header{text-align:center}h1{font:500 clamp(27px,5vw,40px) Georgia,"Songti SC",serif;margin:10px 0}.kicker{font-size:12px;letter-spacing:.15em;color:#95784e}#story{max-width:630px;margin:12px auto 20px}.awning{height:38px;max-width:730px;margin:auto;background:repeating-linear-gradient(90deg,#a67153 0,#a67153 45px,#f1d5ac 45px,#f1d5ac 90px);border-radius:15px 15px 8px 8px;border:1px solid #a47b55;box-shadow:0 5px 0 #e2c7a3}.shop{max-width:730px;margin:auto;padding:20px 24px 25px;border:1px solid #d7c3a2;border-top:0;background:#fff9eb;border-radius:0 0 18px 18px}.budget{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px dashed #cdb999}.coins{display:flex;gap:5px;flex-wrap:wrap}.coin{width:26px;height:26px;border:2px solid #bc8a3e;background:#edd08c;border-radius:50%;color:#a97535;font-size:14px;text-align:center;line-height:21px}.coin.used{background:#e9e0cf;border-color:#c5b69b;color:#c5b69b}.coin.fixed{background:#cab397;border-color:#9e805a;color:#725b3e}h2{font-size:20px;font-weight:600;margin:20px 0 15px}.activities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.activity{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px;text-align:left;border-radius:8px 15px 10px 13px;background:#f5e9d4}.activity .icon{font-size:30px;text-align:center}.activity small{display:block;color:#8a7558;font-size:12px}button{font:inherit;min-height:48px;padding:12px 15px;border:1px solid #c9b08b;color:inherit;cursor:pointer;background:#fff9ee;border-radius:12px}button:hover{background:#eddfc5}button[aria-pressed=true]{background:#e4e5c7;border:2px solid #8e965b;padding:11px 14px}button:focus-visible{outline:3px solid #8a663b;outline-offset:4px}.checkout{background:#856343;color:#fff;margin-top:18px}.checkout:hover{background:#725437}.receipt{margin:22px auto 0;max-width:650px;padding:20px 24px;background:#fffdf7;border-top:1px dashed #b8a27c;border-bottom:1px dashed #b8a27c;min-height:95px}.receipt strong{font-weight:600}#result{margin:0}.reflection{max-width:650px;margin:20px auto 0}.reflection small{color:#8f795f}#again{display:block;margin-top:16px}#commitment{font-size:13px;color:#8b7051}#budget-label{font-size:14px}[hidden]{display:none!important}@media(max-width:500px){main{padding:20px 15px}.shop{padding:16px 13px}.activities{gap:8px}.activity{grid-template-columns:1fr;padding:10px;text-align:center}.activity[aria-pressed=true]{padding:9px}.activity .icon{font-size:26px}h2{font-size:18px}.receipt{padding:17px}.coin{width:23px;height:23px;line-height:18px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><main>
<header><p class="kicker">选择路口 / 今天的时间商店</p><h1>每一个选择都有交换</h1><p id="story"></p></header>
<div class="awning" aria-hidden="true"></div><section class="shop"><div class="budget"><span id="budget-label"></span><div id="coins" class="coins" aria-hidden="true"></div></div><p id="commitment" hidden></p><div id="planning"><h2 id="question">你想怎样安排这段时间？</h2><div id="activities" class="activities"></div><button id="checkout" class="checkout">看看这次交换</button></div></section>
<section class="receipt" aria-label="时间小票"><p id="result" role="status" aria-live="polite">每一种安排都可以有理由。时间票用过之后，可以点同一件事把它放回。</p></section>
<aside id="reflection" class="reflection" hidden><h2 id="reflection-question" tabindex="-1">这次的交换，哪一点是你愿意的？</h2><p id="real-life"></p><small>可以在花园页面的反思框里记下你的理由，再亲手保存。</small><button id="again">换一种安排</button></aside>
</main><script>
(() => {
  const age = new URLSearchParams(location.search).get('age');
  const stage = age === '6-8' ? 0 : age === '12-15' ? 2 : 1;
  const settings = [
    {total:3,unit:10,fixed:0,story:'放学后有半小时。小狐狸带着三张时间票，想玩，也想画画。每张票只能用一次。',options:[['◉','玩小车',2],['✎','画一张画',1],['⌂','看绘本',1],['✿','去院子玩',2]],life:'今天有一小段空闲时间，你想用来做什么？没选的那件事，可以留到什么时候？'},
    {total:6,unit:10,fixed:0,story:'晚饭前还有一小时。游戏、画画、读书、休息都在招手。你可以组合，也可以留一点空白。',options:[['◉','玩游戏',3],['✎','画画',2],['✿','出去玩',3],['☁','发一会儿呆',1],['⌂','读书',2]],life:'如果把十分钟挪给另一件事，原来的安排会怎样变？哪一段时间是你最想保留的？'},
    {total:8,unit:15,fixed:2,story:'周六下午有两小时，其中半小时已约好帮家人整理阳台。其余时间由你安排；同一段时间不能同时交给两件事。',options:[['◉','玩游戏',3],['♧','和朋友散步',3],['✎','做自己的小项目',4],['☁','休息',1],['⌂','阅读',2]],life:'这次暂时放下的最佳替代选择是什么？如果你的优先事项变了，哪部分安排需要一起调整？'}
  ][stage];
  const $ = id => document.getElementById(id); const selected = new Set();
  $('story').textContent = settings.story; $('real-life').textContent = settings.life;
  if (settings.fixed) { $('commitment').hidden = false; $('commitment').textContent = '深色时间票：已约好的整理阳台，共 30 分钟。'; }
  const spent = () => [...selected].reduce((sum,index) => sum + settings.options[index][2],settings.fixed);
  function redraw() {
    const left = settings.total - spent();
    $('budget-label').textContent = '还可以安排 '+left*settings.unit+' 分钟 · 每张 '+settings.unit+' 分钟';
    $('coins').replaceChildren();
    for (let i = 0; i < settings.total; i++) { const coin = document.createElement('span'); coin.className = 'coin'+(i < settings.fixed ? ' fixed' : i < spent() ? ' used' : ''); coin.textContent = '·'; $('coins').append(coin); }
    [...$('activities').children].forEach((button,index) => button.setAttribute('aria-pressed',String(selected.has(index))));
  }
  settings.options.forEach(([icon,label,cost],index) => {
    const button = document.createElement('button'); button.className = 'activity'; button.setAttribute('aria-pressed','false');
    const symbol = document.createElement('span'); symbol.className = 'icon'; symbol.setAttribute('aria-hidden','true'); symbol.textContent = icon;
    const text = document.createElement('span'); text.textContent = label; const small = document.createElement('small'); small.textContent = cost+' 张时间票 · '+cost*settings.unit+' 分钟'; text.append(small); button.append(symbol,text);
    button.addEventListener('click', () => {
      if (selected.has(index)) { selected.delete(index); $('result').textContent = '“'+label+'”的时间票放回来了。你可以重新安排。'; }
      else if (spent()+cost > settings.total) { $('result').textContent = '还差 '+(spent()+cost-settings.total)*settings.unit+' 分钟。如果想选“'+label+'”，需要先放回另一件事的时间票。'; return; }
      else { selected.add(index); $('result').textContent = '你把 '+cost*settings.unit+' 分钟交给了“'+label+'”。这段时间就不能同时交给另一件事。'; }
      redraw();
    }); $('activities').append(button);
  });
  $('checkout').addEventListener('click', () => {
    if (!selected.size) { $('result').textContent = '可以先选一件想做的事，再看看这次交换。'; return; }
    const chosen = [...selected].map(index => settings.options[index][1]);
    const left = settings.total-spent();
    const other = settings.options.filter((_,index) => !selected.has(index)).map(([,label]) => label);
    $('result').textContent = '这次留下：'+chosen.join('、')+'。'+(left ? '还保留了 '+left*settings.unit+' 分钟空白。' : '时间票都安排好了。')+'这份安排暂时没有包含：'+(other.join('、') || '没有其他项目')+'。'+(stage === 2 ? '放下的选择也可能很有价值，取舍取决于你这次在意什么。' : '这些事没有变得不好，只是这一次没有选。');
    $('planning').hidden = true; $('reflection').hidden = false; $('reflection-question').focus();
  });
  $('again').addEventListener('click', () => { $('planning').hidden = false; $('reflection').hidden = true; $('result').textContent = '保留这份安排作起点。点一件已选的事，就可以把时间票拿回来再交换。'; $('activities').querySelector('button').focus(); });
  redraw();
})();
</script></body></html>
