<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的情绪天气 · Seed Grove</title>
  <style>
    :root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#34473e;background:#f7f5ec;font-synthesis:none;line-height:1.75}*{box-sizing:border-box}body{margin:0}main{max-width:860px;margin:auto;padding:30px 24px 42px}header{text-align:center}.eyebrow{font-size:12px;letter-spacing:.18em;color:#687c6c}h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(28px,5vw,44px);font-weight:500;margin:5px 0}p{margin:8px 0}.story{max-width:540px;margin:12px auto 20px;font-size:16px}.window{max-width:610px;margin:20px auto;background:#e2ece4;border:5px solid #baac87;border-radius:48% 48% 18px 18px;overflow:hidden;box-shadow:0 7px 0 #dbd3bb}.window svg{display:block;width:100%;height:235px}.cloud{fill:#b5c6c1}.rain,.bolt{opacity:0}.window[data-weather=rain] .rain,.window[data-weather=storm] .rain,.window[data-weather=storm] .bolt{opacity:1}.window[data-weather=sun] .cloud{opacity:.35}.window[data-weather=rain] .sun,.window[data-weather=storm] .sun{opacity:.25}.window[data-weather=mixed] .rain{opacity:1}.window[data-weather=storm] .cloud{fill:#849994}.sill{text-align:center;background:#ebe6d7;padding:7px;font-size:13px;color:#657468}.question-card{max-width:650px;margin:24px auto 0;text-align:center}h2{font-size:21px;font-weight:600;margin:10px 0}.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0}button{font:inherit;min-height:48px;border:1px solid #bac6b7;border-radius:16px 13px 17px 11px;padding:10px 17px;background:#fffdf7;color:inherit;cursor:pointer}button:hover{background:#edf3e9}button[aria-pressed=true]{background:#dce9d9;border:2px solid #527558;padding:9px 16px}button:focus-visible{outline:3px solid #927543;outline-offset:4px}.next{background:#55735c;color:#fff;margin:10px}button.next:hover{background:#44604b}#result{min-height:58px;color:#546b59;font-size:15px;max-width:540px;margin:auto}.reflection{background:#eeeade;border-left:3px solid #a3b195;padding:16px 20px;border-radius:4px 17px 17px 4px;margin:25px auto 0;max-width:620px}.reflection p:first-child{font-size:12px;letter-spacing:.1em;color:#69765e}.save-note{font-size:12px;color:#6d786b}footer{text-align:center;color:#7c8578;font-size:12px;margin-top:30px}[hidden]{display:none!important}@media(max-width:480px){main{padding:20px 15px 32px}.window svg{height:190px}.choices{gap:8px}button{padding:10px 13px}.story{font-size:15px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
<main>
  <header><p class="eyebrow">内心花园 / 一扇天气窗</p><h1>我的情绪天气</h1><p id="story" class="story"></p></header>
  <div id="weather-window" class="window" data-weather="cloud">
    <svg viewBox="0 0 600 240" role="img" aria-label="窗外有太阳、云和安静的小山">
      <path d="M0 0H600V240H0Z" fill="#e3ece3"/><circle class="sun" cx="397" cy="74" r="35" fill="#e3bb65"/>
      <g stroke="#dac287" stroke-width="3"><path d="M397 21v-10M449 73h14M436 34l8-8M357 37l-8-8"/></g>
      <path class="cloud" d="M156 121C118 122 115 81 150 73C154 32 209 25 233 64C267 38 309 57 311 91C351 91 353 128 317 131Z"/>
      <g class="rain" stroke="#73969c" stroke-width="5" stroke-linecap="round"><path d="M160 148l-5 13M196 148l-5 13M232 148l-5 13M268 148l-5 13M180 176l-5 13M216 176l-5 13M252 176l-5 13"/></g>
      <path class="bolt" d="M295 140l-17 28h16l-11 24 34-38h-18l10-14" fill="#dfb36d"/>
      <path d="M0 211Q116 157 220 208T440 202T600 202V240H0Z" fill="#b5c7a5"/><path d="M0 229Q120 192 253 227T600 213V240H0Z" fill="#7f9c7a"/>
      <path d="M481 220v-29m0 15q-20-1-19-14 18 1 19 14m0-5q19-2 19-17-18 2-19 17" fill="#527459" stroke="#527459" stroke-width="3"/>
    </svg>
    <div class="sill">天气会经过。你可以慢慢看。</div>
  </div>
  <section class="question-card" aria-labelledby="question"><h2 id="question" tabindex="-1"></h2><div id="choices" class="choices"></div><p id="result" role="status" aria-live="polite"></p><button id="next" class="next" hidden>再往里看一点</button><button id="again" hidden>再看看天气</button></section>
  <aside id="reflection" class="reflection" hidden><p>带回今天</p><p id="real-life"></p><p class="save-note">想留下一句话，可以在花园页面的反思框里写下，再亲手保存。</p></aside>
  <footer>感受没有标准答案，也不用把每一天都变成晴天。</footer>
</main>
<script>
(() => {
  const age = new URLSearchParams(location.search).get('age');
  const stage = age === '6-8' ? 0 : age === '12-15' ? 2 : 1;
  const data = [
    {story:'小鹿的野餐遇到了雨。篮子收好了，心里还留着一点小天气。',weather:'如果是你，心里像哪种天气？',body:'你的身体哪里有感觉？',bodies:['肚子紧紧的','肩膀松松的','还说不清'],action:'现在想给自己什么？',actions:['安静坐一会儿','找人陪一陪','慢慢喝口水'],life:'今天心里有小天气时，你想先停下来看看哪里？'},
    {story:'盼了很久的野餐因为下雨取消了。小鹿有些失望，又松了口气：今天终于能休息了。',weather:'此刻的心里，哪种天气更靠近你？',body:'哪一个身体信号最明显？',bodies:['胸口有点闷','手握得很紧','呼吸慢下来','还不确定'],action:'你想先试一个怎样的小照顾？',actions:['先停一停，留意呼吸','告诉信任的人我的感受','换个舒服的位置'],life:'下一次计划改变时，你想先观察身体的哪个信号？'},
    {story:'你准备了小组展示，临时被通知换人发言。失落和轻松可能同时出现；“他们不信任我”仍是一个需要核实的想法。',weather:'先不解释原因，哪种天气像此刻的感受？',body:'暂时放下解释，你能观察到哪个身体信号？',bodies:['肩膀绷紧，呼吸变短','心跳比平时快','身体轻下来','几种信号同时出现','暂时没有明显感觉'],action:'在决定怎样回应前，你想留出哪一点空间？',actions:['先给感受起个临时名字','找信任的人说说，再核实情况','先缓一会儿，稍后再回应'],life:'下次遇到类似变化，哪个是你观察到的感受，哪个是尚未核实的解释？'}
  ][stage];
  const $ = id => document.getElementById(id);
  let step = 0;
  const weather = [['sun','☀ 晴朗'],['cloud','☁ 阴阴的'],['rain','☂ 下小雨'],['storm','ϟ 雷阵雨'],['mixed','☀☂ 晴雨交织']].slice(0, stage === 0 ? 3 : stage === 1 ? 4 : 5);
  $('story').textContent = data.story;
  $('real-life').textContent = data.life;
  function draw(focus = false) {
    $('question').textContent = [data.weather,data.body,data.action][step];
    $('choices').replaceChildren(); $('result').textContent = ''; $('next').hidden = true; $('again').hidden = true; $('reflection').hidden = true;
    const items = step === 0 ? weather : (step === 1 ? data.bodies : data.actions).map((label,index) => [String(index),label]);
    for (const [value,label] of items) {
      const button = document.createElement('button'); button.type = 'button'; button.textContent = label; button.setAttribute('aria-pressed','false');
      button.addEventListener('click', () => {
        for (const sibling of $('choices').children) sibling.setAttribute('aria-pressed',String(sibling === button));
        if (step === 0) {
          $('weather-window').dataset.weather = value;
          $('weather-window').querySelector('svg').setAttribute('aria-label','心里的天气：'+label);
          $('result').textContent = '这片天气可以先留在这里。不用马上改变它。';
        } else if (step === 1) $('result').textContent = '你留意到了“'+label+'”。说不清也没有关系，可以慢慢观察。';
        else { $('result').textContent = '你选了“'+label+'”。试过之后，感受可能变化，也可能还在。两种都可以。'; $('reflection').hidden = false; $('again').hidden = false; }
        $('next').hidden = step === 2;
      });
      $('choices').append(button);
    }
    if (focus) $('question').focus();
  }
  $('next').addEventListener('click', () => { step += 1; draw(true); });
  $('again').addEventListener('click', () => { step = 0; draw(true); });
  draw();
})();
</script>
</body>
</html>
