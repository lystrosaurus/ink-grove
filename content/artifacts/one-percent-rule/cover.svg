<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">1%法则：一次改进一个关键动作</title><rect width="960" height="640" fill="#f3eee4"/><g stroke="#dbd1c1" stroke-width="1"><path d="M54 320H906M54 388H906M54 456H906M54 524H906"/></g><g font-family="'Microsoft YaHei','PingFang SC',sans-serif"><text x="58" y="61" font-size="14" letter-spacing="4" fill="#8c6956">THE 1% SOLUTION / FIELD NOTES</text><text x="50" y="173" font-size="96" fill="#312c26">1%法则</text><text x="57" y="222" font-size="25" fill="#8c6956">把微小的正确行动，变成循环。</text><path d="M100 490H250V453H400V411H550V362H700V305H859" fill="none" stroke="#b7603f" stroke-width="8" stroke-linejoin="round"/><path d="M839 285L859 305L839 325" fill="none" stroke="#b7603f" stroke-width="6"/><circle cx="400" cy="411" r="16" fill="#f3eee4" stroke="#b7603f" stroke-width="5"/><text x="146" y="561" font-size="19" fill="#6c665c">行动</text><text x="340" y="561" font-size="19" fill="#6c665c">记录</text><text x="534" y="561" font-size="19" fill="#6c665c">反馈</text><text x="729" y="561" font-size="19" fill="#6c665c">下一步</text><rect x="711" y="99" width="142" height="118" rx="3" fill="#b7603f" transform="rotate(5 782 158)"/><text x="782" y="151" font-size="32" fill="#fff7e8" text-anchor="middle">只改进</text><text x="782" y="191" font-size="32" fill="#fff7e8" text-anchor="middle">一件事</text><path d="M54 585H906" stroke="#b9ab95"/><text x="56" y="618" font-size="14" letter-spacing="2" fill="#8c6956">TOM CONNELLAN · MOMENTUM BEFORE MOTIVATION</text></g></svg>
