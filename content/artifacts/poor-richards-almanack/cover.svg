<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f6eed8"/><g color="#7c332c"><g fill="none" stroke="currentColor" stroke-width="3"><rect x="810" y="120" width="275" height="410"/><rect x="822" y="132" width="251" height="386"/><circle cx="947" cy="240" r="63"/><path d="M847 355h200M847 380h200M847 425h200M847 450h200"/></g></g><text x="80" y="110" fill="#7c332c" font-family="sans-serif" font-size="23">INK GROVE / READING EDITION</text><text x="80" y="345" fill="#28251e" font-family="sans-serif" font-weight="700" font-size="84">穷理查年鉴选读</text><text x="80" y="445" fill="#28251e" font-family="sans-serif" font-size="27">让十八世纪的格言，接受今天生活条件的追问</text><text x="80" y="655" fill="#7c332c" font-family="sans-serif" font-size="23">Benjamin Franklin</text></svg>