<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">认知觉醒 · 内在操作系统</title><rect x="0" y="0" width="960" height="640" rx="0" fill="#f2f5f1" stroke="none"/><g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"><text x="53" y="58" font-size="14" fill="#4d7c73" letter-spacing="3">INNER OPERATING SYSTEM</text><text x="49" y="149" font-size="68" fill="#20302a" >认知觉醒</text><text x="54" y="196" font-size="26" fill="#6d7b74" >从被推动，到能选择。</text><circle cx="648" cy="409" r="123" fill="none" stroke="#c4d3c9"/><circle cx="648" cy="409" r="75" fill="#dce9e3" stroke="none"/><text x="648" y="416" font-size="28" fill="#20302a" text-anchor="middle">内在系统</text><circle cx="648" cy="286" r="39" fill="#f2f5f1" stroke="#4d7c73"/><text x="648" y="294" font-size="22" fill="#4d7c73" text-anchor="middle">觉察</text><circle cx="796" cy="375" r="39" fill="#f2f5f1" stroke="#7f9fb3"/><text x="796" y="383" font-size="22" fill="#7f9fb3" text-anchor="middle">看清</text><circle cx="739" cy="522" r="39" fill="#f2f5f1" stroke="#c6a15f"/><text x="739" y="530" font-size="22" fill="#c6a15f" text-anchor="middle">选择</text><circle cx="557" cy="522" r="39" fill="#f2f5f1" stroke="#c97866"/><text x="557" y="530" font-size="22" fill="#c97866" text-anchor="middle">行动</text><circle cx="500" cy="375" r="39" fill="#f2f5f1" stroke="#9a90b5"/><text x="500" y="383" font-size="22" fill="#9a90b5" text-anchor="middle">反馈</text><text x="55" y="330" font-size="21" fill="#4d7c73" >看见思维</text><text x="55" y="379" font-size="21" fill="#4d7c73" >管理注意力</text><text x="55" y="428" font-size="21" fill="#4d7c73" >消除模糊</text><text x="55" y="477" font-size="21" fill="#4d7c73" >回到行动</text><line x1="54" y1="574" x2="906" y2="574" stroke="#d8e0da" stroke-width="1"/><text x="54" y="612" font-size="14" fill="#6d7b74" letter-spacing="2">周岭</text><text x="906" y="612" font-size="12" fill="#6d7b74" text-anchor="end" letter-spacing="2">SEE · CHOOSE · ACT</text></g></svg>
