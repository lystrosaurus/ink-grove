<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">认知觉醒 · 知识特刊</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="currentColor" stroke-opacity=".09" stroke-width="1"/></pattern><linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#273651"/><stop offset="1" stop-color="#57608b"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4edde"/><stop offset="1" stop-color="#e8dfc9"/></linearGradient></defs><rect x="0" y="0" width="960" height="640" fill="#f0e9dc" /><g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
