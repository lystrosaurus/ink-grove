<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">当下的力量：把注意力带回此刻</title><rect width="960" height="640" fill="#f6f7ef"/><ellipse cx="674" cy="365" rx="171" ry="172" fill="#e8eee5"/><circle cx="674" cy="365" r="124" fill="none" stroke="#abc0ac" stroke-width="1.5"/><circle cx="674" cy="365" r="86" fill="none" stroke="#91ad96" stroke-width="1.5"/><circle cx="674" cy="365" r="47" fill="none" stroke="#819b8b" stroke-width="2"/><g font-family="'Noto Serif SC','Microsoft YaHei','PingFang SC',serif"><text x="60" y="67" font-size="14" letter-spacing="4" fill="#6d8375">THE POWER OF NOW</text><text x="57" y="184" font-size="84" fill="#395148">当下的力量</text><text x="64" y="273" font-size="28" fill="#6d8375">停一停。</text><text x="64" y="326" font-size="28" fill="#6d8375">注意一个念头。</text><text x="64" y="379" font-size="28" fill="#6d8375">感受此刻。</text><text x="674" y="376" text-anchor="middle" font-size="26" fill="#395148">此刻</text><text x="66" y="502" font-size="20" fill="#6d8375">觉察，让念头与行动之间多一点空间。</text><path d="M63 561H896" stroke="#d8ddd7"/><text x="64" y="604" font-size="14" letter-spacing="3" fill="#6d8375">ECKHART TOLLE · PRESENCE / STILLNESS / ACCEPTANCE</text></g></svg>
