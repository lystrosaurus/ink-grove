<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">逻辑思维</title><rect x="0" y="0" width="960" height="640" rx="0" fill="#eef1f3" stroke="none"/><g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"><text x="54" y="57" font-size="14" fill="#246ea6" letter-spacing="3">MINDWARE · REASONING BLUEPRINT</text><text x="52" y="144" font-size="67" fill="#11161b" >逻辑思维</text><text x="56" y="193" font-size="24" fill="#697580" >情境呢？概率呢？因果证据呢？</text><text x="54" y="306" font-size="30" fill="#246ea6" >观察 ≠ 解释</text><text x="54" y="359" font-size="30" fill="#246ea6" >相关 ≠ 因果</text><text x="55" y="423" font-size="21" fill="#697580" >让判断能够被证据修正。</text><line x1="630" y1="288" x2="816" y2="455" stroke="#9dadb9" stroke-width="2"/><line x1="586" y1="469" x2="630" y2="288" stroke="#9dadb9" stroke-width="2"/><line x1="586" y1="469" x2="816" y2="455" stroke="#9dadb9" stroke-width="2"/><circle cx="630" cy="288" r="42" fill="#fafbfc" stroke="#246ea6"/><text x="630" y="300" font-size="34" fill="#246ea6" text-anchor="middle">A</text><circle cx="816" cy="455" r="42" fill="#fafbfc" stroke="#c5554d"/><text x="816" y="467" font-size="34" fill="#c5554d" text-anchor="middle">B</text><circle cx="586" cy="469" r="42" fill="#fafbfc" stroke="#5f866e"/><text x="586" y="481" font-size="34" fill="#5f866e" text-anchor="middle">C</text><text x="730" y="343" font-size="18" fill="#246ea6" >关联？</text><text x="512" y="376" font-size="17" fill="#5f866e" >第三变量？</text><text x="715" y="506" font-size="17" fill="#c5554d" >反向因果？</text><line x1="54" y1="572" x2="906" y2="572" stroke="#cfd7dd" stroke-width="1"/><text x="54" y="611" font-size="13" fill="#697580" letter-spacing="2">RICHARD E. NISBETT</text><text x="906" y="611" font-size="13" fill="#697580" text-anchor="end" letter-spacing="1">CONTEXT · PROBABILITY · EXPERIMENT</text></g></svg>
