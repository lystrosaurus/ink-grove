<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">人生十二法则</title><rect x="0" y="0" width="960" height="640" rx="0" fill="#f3eee3" stroke="none"/><g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"><text x="53" y="58" font-size="14" fill="#7b3f42" letter-spacing="4">12 RULES FOR LIFE</text><text x="50" y="144" font-size="65" fill="#272723" >人生十二法则</text><text x="55" y="191" font-size="24" fill="#6d6a62" >在秩序与混乱之间，站稳自己。</text><text x="56" y="307" font-size="28" fill="#7b3f42" >责任</text><text x="56" y="360" font-size="28" fill="#7b3f42" >意义</text><text x="56" y="413" font-size="28" fill="#7b3f42" >诚实</text><text x="57" y="482" font-size="20" fill="#6d6a62" >承担能够承担的一小块现实。</text><circle cx="712" cy="365" r="155" fill="#eee1cc" stroke="#a67c46"/><path d="M712 210A155 155 0 0 1 712 520C639 471 775 420 712 365S639 259 712 210Z" fill="#7b3f42"/><circle cx="712" cy="289" r="17" fill="#7b3f42" stroke="none"/><circle cx="712" cy="442" r="17" fill="#eee1cc" stroke="none"/><text x="557" y="555" font-size="17" fill="#a67c46" >秩序 ORDER</text><text x="752" y="555" font-size="17" fill="#7b3f42" >CHAOS 混乱</text><line x1="54" y1="583" x2="906" y2="583" stroke="#d5ccbd" stroke-width="1"/><text x="54" y="614" font-size="13" fill="#6d6a62" letter-spacing="2">JORDAN B. PETERSON</text></g></svg>
