<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">系统之美</title><rect x="0" y="0" width="960" height="640" rx="0" fill="#f4f0e6" stroke="none"/><g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"><text x="54" y="57" font-size="14" fill="#69736d" letter-spacing="4">THINKING IN SYSTEMS</text><text x="51" y="145" font-size="67" fill="#28312d" >系统之美</text><text x="55" y="193" font-size="25" fill="#69736d" >结构，产生行为。</text><text x="55" y="300" font-size="24" fill="#405f52" >存量，是系统的记忆。</text><text x="55" y="343" font-size="20" fill="#69736d" >流量改变状态，反馈塑造轨迹。</text><line x1="92" y1="442" x2="325" y2="442" stroke="#71877a" stroke-width="5"/><rect x="325" y="383" width="262" height="118" rx="9" fill="#dfe7df" stroke="#71877a"/><text x="456" y="434" font-size="27" fill="#405f52" text-anchor="middle">存量 STOCK</text><text x="456" y="466" font-size="17" fill="#69736d" text-anchor="middle">知识 · 信任 · 能力</text><line x1="587" y1="442" x2="842" y2="442" stroke="#b66d4f" stroke-width="5"/><text x="164" y="416" font-size="18" fill="#405f52" text-anchor="middle">流入</text><text x="735" y="416" font-size="18" fill="#b66d4f" text-anchor="middle">流出</text><path d="M735 468V537H165V468" fill="none" stroke="#738c99" stroke-width="2" stroke-dasharray="7 6"/><text x="454" y="562" font-size="16" fill="#738c99" text-anchor="middle" letter-spacing="2">FEEDBACK · DELAY · LEVERAGE</text><circle cx="792" cy="160" r="66" fill="none" stroke="#71877a"/><circle cx="792" cy="160" r="43" fill="none" stroke="#b66d4f"/><text x="792" y="178" font-size="57" fill="#405f52" text-anchor="middle">↻</text><line x1="54" y1="584" x2="906" y2="584" stroke="#d9d6cc" stroke-width="1"/><text x="54" y="615" font-size="13" fill="#69736d" letter-spacing="2">DONELLA H. MEADOWS</text></g></svg>
