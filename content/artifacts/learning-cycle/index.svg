<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title"><title id="title">学习如何真正发生：觉察、定义、尝试、反馈、修正、更新的循环</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="currentColor" stroke-opacity=".09" stroke-width="1"/></pattern><linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#273651"/><stop offset="1" stop-color="#57608b"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4edde"/><stop offset="1" stop-color="#e8dfc9"/></linearGradient></defs><rect x="0" y="0" width="1200" height="920" fill="#eff2e9" /><g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <text x="70" y="61" font-size="13" fill="#728475" letter-spacing="3" font-family="Arial, sans-serif">INK GROVE / A LIVING LEARNING SYSTEM</text><line x1="70" y1="92" x2="1130" y2="92" stroke="#c5d0bd" stroke-width="1" />
  <text x="68" y="171" font-size="55" fill="#395747" font-weight="500">学习如何真正发生</text><text x="71" y="218" font-size="25" fill="#7a8b78" >让每一次尝试，成为下一次成长的起点。</text>
  <ellipse cx="600" cy="490" rx="360" ry="183" fill="none" stroke="#9fb49c" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="600" y="483" font-size="25" fill="#647c65" text-anchor="middle">能力不是输入的总和，</text><text x="600" y="527" font-size="25" fill="#647c65" text-anchor="middle">而是理解与行动的相互校准。</text>
  <rect x="124" y="300" width="272" height="128" fill="#f9faf5" rx="12" stroke="#b8c9b0"/><text x="150" y="330" font-size="13" fill="#89a082" letter-spacing="3" font-family="Arial, sans-serif">01</text><text x="260" y="368" font-size="32" fill="#4c6e53" text-anchor="middle">觉察</text><text x="260" y="405" font-size="17" fill="#81917a" text-anchor="middle">我在哪里遇到阻力？</text><rect x="464" y="235" width="272" height="128" fill="#f9faf5" rx="12" stroke="#b8c9b0"/><text x="490" y="265" font-size="13" fill="#89a082" letter-spacing="3" font-family="Arial, sans-serif">02</text><text x="600" y="303" font-size="32" fill="#4c6e53" text-anchor="middle">定义</text><text x="600" y="340" font-size="17" fill="#81917a" text-anchor="middle">这次只改善哪一点？</text><rect x="804" y="300" width="272" height="128" fill="#f9faf5" rx="12" stroke="#b8c9b0"/><text x="830" y="330" font-size="13" fill="#89a082" letter-spacing="3" font-family="Arial, sans-serif">03</text><text x="940" y="368" font-size="32" fill="#4c6e53" text-anchor="middle">尝试</text><text x="940" y="405" font-size="17" fill="#81917a" text-anchor="middle">在学习区完成一个动作。</text><rect x="804" y="560" width="272" height="128" fill="#f9faf5" rx="12" stroke="#b8c9b0"/><text x="830" y="590" font-size="13" fill="#89a082" letter-spacing="3" font-family="Arial, sans-serif">04</text><text x="940" y="628" font-size="32" fill="#4c6e53" text-anchor="middle">反馈</text><text x="940" y="665" font-size="17" fill="#81917a" text-anchor="middle">哪里发生了可见的变化？</text><rect x="464" y="625" width="272" height="128" fill="#f9faf5" rx="12" stroke="#b8c9b0"/><text x="490" y="655" font-size="13" fill="#89a082" letter-spacing="3" font-family="Arial, sans-serif">05</text><text x="600" y="693" font-size="32" fill="#4c6e53" text-anchor="middle">修正</text><text x="600" y="730" font-size="17" fill="#81917a" text-anchor="middle">下一轮改变一个条件。</text><rect x="124" y="560" width="272" height="128" fill="#f9faf5" rx="12" stroke="#b8c9b0"/><text x="150" y="590" font-size="13" fill="#89a082" letter-spacing="3" font-family="Arial, sans-serif">06</text><text x="260" y="628" font-size="32" fill="#4c6e53" text-anchor="middle">更新</text><text x="260" y="665" font-size="17" fill="#81917a" text-anchor="middle">留出恢复和消化的空间。</text>
  <line x1="70" y1="806" x2="1130" y2="806" stroke="#c5d0bd" stroke-width="1" /><text x="72" y="850" font-size="18" fill="#7d9079" >从《刻意练习》的反馈协议，到《七个习惯》的不断更新。</text><text x="72" y="884" font-size="13" fill="#94a58c" letter-spacing="3" font-family="Arial, sans-serif">A SYNTHESIS BY INK GROVE</text>
</g></svg>
