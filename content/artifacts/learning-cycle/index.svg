<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160" role="img" aria-labelledby="title"><title id="title">学习如何真正发生：觉察、定义、尝试、反馈、修正、更新的循环</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="currentColor" stroke-opacity=".09" stroke-width="1"/></pattern><linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#273651"/><stop offset="1" stop-color="#57608b"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4edde"/><stop offset="1" stop-color="#e8dfc9"/></linearGradient></defs><rect x="0" y="0" width="1200" height="1160" fill="#eff2e9" /><g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <text x="70" y="61" font-size="13" fill="#728475" letter-spacing="3" font-family="Arial, sans-serif">INK GROVE / A LIVING LEARNING SYSTEM</text><line x1="70" y1="92" x2="1130" y2="92" stroke="#c5d0bd" stroke-width="1" />
  <text x="68" y="171" font-size="55" fill="#395747" font-weight="500">学习如何真正发生</text><text x="71" y="218" font-size="25" fill="#7a8b78" >让一次尝试留下证据，也留下修正的可能。</text>
  <defs><marker id="direction" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6b856a"/></marker></defs><g fill="none" stroke="#6b856a" stroke-width="2" marker-end="url(#direction)"><path d="M398 329L452 315"/><path d="M740 315L790 333"/><path d="M973 440V546"/><path d="M792 671L751 687"/><path d="M452 688L410 672"/><path d="M226 548V443"/></g><ellipse cx="600" cy="490" rx="360" ry="183" fill="none" stroke="#9fb49c" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="600" y="483" font-size="25" fill="#647c65" text-anchor="middle">能力不是输入的总和，</text><text x="600" y="527" font-size="25" fill="#647c65" text-anchor="middle">而是理解与行动的相互校准。</text>
  <rect x="124" y="300" width="272" height="128" fill="#f9faf5" rx="12" stroke="#b8c9b0"/><text x="150" y="330" font-size="13" fill="#89a082" letter-spacing="3" font-family="Arial, sans-serif">01</text><text x="260" y="368" font-size="32" fill="#4c6e53" text-anchor="middle">觉察</text><text x="260" y="405" font-size="17" fill="#81917a" text-anchor="middle">我在哪里遇到阻力？</text><rect x="464" y="235" width="272" height="128" fill="#f9faf5" rx="12" stroke="#b8c9b0"/><text x="490" y="265" font-size="13" fill="#89a082" letter-spacing="3" font-family="Arial, sans-serif">02</text><text x="600" y="303" font-size="32" fill="#4c6e53" text-anchor="middle">定义</text><text x="600" y="340" font-size="17" fill="#81917a" text-anchor="middle">这次只改善哪一点？</text><rect x="804" y="300" width="272" height="128" fill="#f9faf5" rx="12" stroke="#b8c9b0"/><text x="830" y="330" font-size="13" fill="#89a082" letter-spacing="3" font-family="Arial, sans-serif">03</text><text x="940" y="368" font-size="32" fill="#4c6e53" text-anchor="middle">尝试</text><text x="940" y="405" font-size="17" fill="#81917a" text-anchor="middle">目标明确，困难可以借助帮助。</text><rect x="804" y="560" width="272" height="128" fill="#f9faf5" rx="12" stroke="#b8c9b0"/><text x="830" y="590" font-size="13" fill="#89a082" letter-spacing="3" font-family="Arial, sans-serif">04</text><text x="940" y="628" font-size="32" fill="#4c6e53" text-anchor="middle">反馈</text><text x="940" y="665" font-size="17" fill="#81917a" text-anchor="middle">结果、代价与预期差在哪？</text><rect x="464" y="625" width="272" height="128" fill="#f9faf5" rx="12" stroke="#b8c9b0"/><text x="490" y="655" font-size="13" fill="#89a082" letter-spacing="3" font-family="Arial, sans-serif">05</text><text x="600" y="693" font-size="32" fill="#4c6e53" text-anchor="middle">修正</text><text x="600" y="730" font-size="17" fill="#81917a" text-anchor="middle">继续、修改，还是先停止？</text><rect x="124" y="560" width="272" height="128" fill="#f9faf5" rx="12" stroke="#b8c9b0"/><text x="150" y="590" font-size="13" fill="#89a082" letter-spacing="3" font-family="Arial, sans-serif">06</text><text x="260" y="628" font-size="32" fill="#4c6e53" text-anchor="middle">更新</text><text x="260" y="665" font-size="17" fill="#81917a" text-anchor="middle">留出恢复和消化的空间。</text>
  <line x1="70" y1="806" x2="1130" y2="806" stroke="#c5d0bd" stroke-width="1" /><text x="72" y="850" font-size="18" fill="#7d9079" >本站综合图解：借用《刻意练习》的反馈与《七个习惯》的更新视角。</text><text x="72" y="884" font-size="13" fill="#94a58c" letter-spacing="3" font-family="Arial, sans-serif">A SYNTHESIS BY INK GROVE</text>
<g font-size="18" fill="#536f55"><rect x="70" y="925" width="1060" height="170" rx="14" fill="#f9faf5" stroke="#b8c9b0"/><text x="98" y="963" font-size="23">用“解释一个概念”走一轮 · 本站原创例子</text><text x="98" y="1004">合上书解释 → 对照材料找遗漏 → 换一个情境再解释</text><text x="98" y="1041">今天答对是表现；隔一段时间仍能应用，才是新的保留与迁移线索。</text><text x="98" y="1077">反馈可能含噪声；无法改进时，也检查目标、资源和休息，而非加倍练习。</text></g></g></svg>
