<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">卓有成效的管理者：从时间走向贡献</title><rect width="960" height="640" fill="#f0f4f2"/><rect x="34" y="29" width="892" height="582" fill="none" stroke="#c7d4cf"/><g font-family="'Microsoft YaHei','PingFang SC',sans-serif"><text x="58" y="65" font-size="14" letter-spacing="3" fill="#5f7872">EXECUTIVE EFFECTIVENESS / 55TH ANNIVERSARY</text><text x="52" y="160" font-size="68" fill="#263c3e">卓有成效的管理者</text><text x="58" y="209" font-size="25" fill="#356d68">真正改变了什么，比完成了多少更重要。</text><g fill="#e0ece6" stroke="#9eb7ac"><rect x="60" y="290" width="155" height="201" rx="3"/><rect x="231" y="290" width="155" height="201" rx="3"/><rect x="402" y="290" width="155" height="201" rx="3"/><rect x="573" y="290" width="155" height="201" rx="3"/><rect x="744" y="290" width="155" height="201" rx="3"/></g><g font-size="16" fill="#5f7872"><text x="83" y="326">01 / TIME</text><text x="254" y="326">02 / OUTPUT</text><text x="425" y="326">03 / STRENGTH</text><text x="596" y="326">04 / FOCUS</text><text x="767" y="326">05 / DECIDE</text></g><g font-size="29" fill="#356d68"><text x="137" y="393" text-anchor="middle">时间</text><text x="308" y="393" text-anchor="middle">贡献</text><text x="479" y="393" text-anchor="middle">长处</text><text x="650" y="393" text-anchor="middle">要事</text><text x="821" y="393" text-anchor="middle">决策</text></g><g stroke="#6b9c91" stroke-width="4"><path d="M94 448H181M265 448H352M436 448H523M607 448H694M778 448H865"/></g><text x="58" y="544" font-size="20" fill="#5f7872">有效，是一组可以学习并反复实践的动作。</text><path d="M58 565H899" stroke="#c7d4cf"/><text x="58" y="595" font-size="14" letter-spacing="2" fill="#5f7872">PETER F. DRUCKER · THE EFFECTIVE EXECUTIVE</text></g></svg>
