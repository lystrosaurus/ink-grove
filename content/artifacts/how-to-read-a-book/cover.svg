<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">如何阅读一本书</title><rect x="0" y="0" width="960" height="640" rx="0" fill="#f6f1e7" stroke="none"/><g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"><text x="54" y="58" font-size="14" fill="#9f5e4e" letter-spacing="4">HOW TO READ A BOOK</text><text x="51" y="145" font-size="62" fill="#252822" >如何阅读一本书</text><text x="56" y="194" font-size="24" fill="#6f746b" >不是看完，而是真正理解。</text><rect x="68" y="416" width="184" height="143" rx="4" fill="#efe0da" stroke="#d9d2c6"/><text x="86" y="456" font-size="15" fill="#6f746b" letter-spacing="1">LEVEL 01</text><text x="86" y="498" font-size="26" fill="#252822" >基础阅读</text><rect x="270" y="365" width="184" height="194" rx="4" fill="#e3e9e2" stroke="#d9d2c6"/><text x="288" y="405" font-size="15" fill="#6f746b" letter-spacing="1">LEVEL 02</text><text x="288" y="447" font-size="26" fill="#252822" >检视阅读</text><rect x="472" y="314" width="184" height="245" rx="4" fill="#e3e9ed" stroke="#d9d2c6"/><text x="490" y="354" font-size="15" fill="#6f746b" letter-spacing="1">LEVEL 03</text><text x="490" y="396" font-size="26" fill="#252822" >分析阅读</text><rect x="674" y="263" width="184" height="296" rx="4" fill="#efe6d2" stroke="#d9d2c6"/><text x="692" y="303" font-size="15" fill="#6f746b" letter-spacing="1">LEVEL 04</text><text x="692" y="345" font-size="26" fill="#252822" >主题阅读</text><text x="70" y="303" font-size="22" fill="#9f5e4e" >一本书，是一次对话。</text><text x="70" y="343" font-size="18" fill="#6f746b" >多本书，通向一个问题。</text><line x1="55" y1="581" x2="905" y2="581" stroke="#d9d2c6" stroke-width="1"/><text x="55" y="613" font-size="12" fill="#6f746b" letter-spacing="1.6">MORTIMER J. ADLER / CHARLES VAN DOREN</text></g></svg>
