<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">经济学的思维方式：选择、激励与制度</title><rect width="960" height="640" fill="#f3f6ef"/><g font-family="'Microsoft YaHei','PingFang SC',sans-serif"><text x="56" y="65" font-size="14" letter-spacing="3" fill="#627b6b">THE ECONOMIC WAY OF THINKING / 13TH EDITION</text><text x="50" y="164" font-size="71" fill="#263230">经济学的思维方式</text><text x="56" y="212" font-size="25" fill="#627b6b">换一副镜片，继续追问：然后呢？</text><circle cx="284" cy="388" r="112" fill="#dfeee7" fill-opacity=".7" stroke="#356d5a" stroke-width="2"/><circle cx="480" cy="388" r="112" fill="#eee2ca" fill-opacity=".7" stroke="#bd884d" stroke-width="2"/><circle cx="676" cy="388" r="112" fill="#dce9ed" fill-opacity=".7" stroke="#4b7184" stroke-width="2"/><text x="276" y="380" text-anchor="middle" font-size="31" fill="#356d5a">选择</text><text x="276" y="422" text-anchor="middle" font-size="17" fill="#57786a">机会成本 · 取舍</text><text x="480" y="380" text-anchor="middle" font-size="31" fill="#977041">激励</text><text x="480" y="422" text-anchor="middle" font-size="17" fill="#977041">价格 · 行为调整</text><text x="684" y="380" text-anchor="middle" font-size="31" fill="#4b7184">制度</text><text x="684" y="422" text-anchor="middle" font-size="17" fill="#4b7184">规则 · 社会协调</text><path d="M283 518V541H677V518" fill="none" stroke="#92aa9b"/><text x="480" y="575" text-anchor="middle" font-size="17" fill="#627b6b">让分散的选择，产生共同的后果。</text><path d="M56 594H904" stroke="#d4ddd8"/><text x="56" y="622" font-size="13" letter-spacing="2" fill="#627b6b">PAUL HEYNE · PETER BOETTKE · DAVID PRYCHITKO</text></g></svg>
